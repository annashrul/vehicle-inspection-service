quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:inspection}
quarkus.datasource.password=${POSTGRES_PASSWORD:inspection_local}
%prod.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/inspection}
%dev.quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/inspection}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
%prod.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
%dev.quarkus.mongodb.connection-string=${MONGODB_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGODB_DATABASE:inspection}
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Request-ID
quarkus.http.cors.exposed-headers=X-Request-ID
quarkus.log.console.json=true
quarkus.smallrye-openapi.info-title=Vehicle Inspection Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.mongodb.devservices.image-name=mongo:7

quarkus.hibernate-orm.jdbc.statement-batch-size=50

mp.openapi.filter=com.logique.inspection.OpenApiFilter
