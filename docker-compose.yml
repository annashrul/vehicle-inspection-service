services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspection
      POSTGRES_USER: ${POSTGRES_USER:-inspection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspection_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d inspection"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/inspection
      POSTGRES_USER: ${POSTGRES_USER:-inspection}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inspection_local}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: inspection
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
  tests:
    profiles: [test]
    build:
      context: ./backend
      target: build
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/inspection_test
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-inspection}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-inspection_local}
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      QUARKUS_MONGODB_CONNECTION_STRING: mongodb://mongo:27017
      QUARKUS_MONGODB_DATABASE: inspection_test
      QUARKUS_MONGODB_DEVSERVICES_ENABLED: "false"
    command: ["mvn", "-B", "test"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
volumes:
  postgres_data:
  mongo_data:
